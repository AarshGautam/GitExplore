events {
  worker_connections 1024;
}
 
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
 
  # needed for socket.io / websockets
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
 
  upstream api_servers {
    least_conn;
    server api1:5000 max_fails=3 fail_timeout=30s;
    server api2:5000 max_fails=3 fail_timeout=30s;
    server api3:5000 max_fails=3 fail_timeout=30s;
  }
 
  server {
    listen 80;
 
    root /usr/share/nginx/html;   # React build
    index index.html;
 
    location /api/ {
      proxy_pass http://api_servers;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;
 
      # THIS is how you verify load balancing
      add_header X-Served-By $upstream_addr always;
    }
    # React Router fallback - must be last
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

